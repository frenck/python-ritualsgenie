---
name: Feature request
description: Suggest a new feature for the Rituals Perfume Genie Python client.
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the feature you'd like to see.
    validations:
      required: true
  - type: input
    id: diffuser-model
    attributes:
      label: Diffuser model
      description: The Perfume Genie model you are using (if relevant).
      placeholder: e.g., Perfume Genie 2.0
    validations:
      required: false
  - type: textarea
    id: additional-information
    attributes:
      label: Additional information
      description: Any additional context, examples, or references.
    validations:
      required: false
