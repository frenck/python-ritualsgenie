---
name: Testing

# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:

env:
  DEFAULT_PYTHON: "3.12"

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up Poetry
        run: pipx install poetry
      - name: 🏗 Set up Python ${{ matrix.python }}
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: "poetry"
      - name: 🏗 Install workflow dependencies
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
      - name: 🏗 Install dependencies
        run: poetry install --no-interaction
      - name: 🚀 Run pytest
        run: poetry run pytest --cov ritualsgenie tests
      - name: ⬆️ Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.python }}
          include-hidden-files: true
          path: .coverage

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🏗 Set up Poetry
        run: pipx install poetry
      - name: 🏗 Set up Python ${{ env.DEFAULT_PYTHON }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: 🏗 Build package
        run: poetry build --no-interaction
      # The tests run against the development install; this checks what
      # users actually get from PyPI, in an environment without dev tools.
      - name: 🧪 Check the wheel in a clean environment
        run: |
          wheel=$(ls dist/ritualsgenie-*-py3-none-any.whl)
          python -m venv "${RUNNER_TEMP}/wheel"
          "${RUNNER_TEMP}/wheel/bin/pip" install "${wheel}"
          "${RUNNER_TEMP}/wheel/bin/python" -c "
          from importlib.resources import files
          import ritualsgenie
          assert files('ritualsgenie').joinpath('py.typed').is_file()
          "
          if "${RUNNER_TEMP}/wheel/bin/ritualsgenie" --help; then
            echo "Expected an install hint without the cli extra"
            exit 1
          fi
          "${RUNNER_TEMP}/wheel/bin/pip" install "${wheel}[cli]"
          "${RUNNER_TEMP}/wheel/bin/ritualsgenie" --help
      - name: 🧪 Check the sdist builds a wheel
        run: |
          python -m venv "${RUNNER_TEMP}/sdist"
          "${RUNNER_TEMP}/sdist/bin/pip" wheel --no-deps \
            --wheel-dir "${RUNNER_TEMP}/sdist-wheel" dist/ritualsgenie-*.tar.gz

  coverage:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: ⬇️ Download coverage data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      - name: 🏗 Set up Poetry
        run: pipx install poetry
      - name: 🏗 Set up Python ${{ env.DEFAULT_PYTHON }}
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: "poetry"
      - name: 🏗 Install workflow dependencies
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true
      - name: 🏗 Install dependencies
        run: poetry install --no-interaction
      - name: 🚀 Process coverage results
        run: |
          poetry run coverage combine coverage*/.coverage*
          poetry run coverage xml -i
      - name: 🚀 Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
